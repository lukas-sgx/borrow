name: Security Audit

on:
  push:
    paths: 
      - 'vendor/**'
  pull_request:
    paths: 
      - 'vendor/**'
  schedule:
    - cron: '0 0 * * 1'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run security-audit
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...